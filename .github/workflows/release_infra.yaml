name: Release Infra

on:
  workflow_dispatch:
  push:
    tags:
      # Trigger this workflow when a tag `@infra/resources@<sem-ver>` is pushed.
      - '@infra/resources@[0-9]+.[0-9]+.[0-9]+'

jobs:
  release_prod:
    concurrency:
      cancel-in-progress: false
      group: terraform

    uses: pagopa/dx/.github/workflows/infra_apply.yaml@dea3cc35e4d6a26cc8aa3b08ab22d48c0f958f77 # main
    name: Infrastructure Apply
    secrets: inherit
    with:
      environment: prod
      base_path: infra/resources
